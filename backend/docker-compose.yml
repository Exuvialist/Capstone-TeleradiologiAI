services:
  postgres:
    image: postgres:16
    container_name: teleradiologi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teleradiologi
      POSTGRES_PASSWORD: teleradiologi_dev
      POSTGRES_DB: teleradiologi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
